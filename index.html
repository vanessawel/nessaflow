<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NessaFlow">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef0f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141725" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>body{margin:0;-webkit-tap-highlight-color:transparent}img{max-width:100%}*{box-sizing:border-box}</style>
<title>NessaFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: one calm column, max 560px, bottom tab bar; one thing per card, big tap targets */
:root{
  --bg:#eef0f6; --surface:#ffffff; --sunk:#e3e6f0; --fg:#1d2233; --muted:#5d6480;
  --line:#d3d7e6; --accent:#3b4fd8; --accent-ink:#ffffff; --sun:#f2b630; --sun-soft:#fdf1d2;
  --good:#2f8a5b; --good-soft:#dff2e7;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141725; --surface:#1e2234; --sunk:#262b40; --fg:#eceef7; --muted:#a2a8c4;
  --line:#33395290; --accent:#8c9bff; --accent-ink:#11142a; --sun:#f5c452; --sun-soft:#3a3220;
  --good:#6fd39c; --good-soft:#1d3a2b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141725; --surface:#1e2234; --sunk:#262b40; --fg:#eceef7; --muted:#a2a8c4;
  --line:#33395290; --accent:#8c9bff; --accent-ink:#11142a; --sun:#f5c452; --sun-soft:#3a3220;
  --good:#6fd39c; --good-soft:#1d3a2b; color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding-block:calc(20px + env(safe-area-inset-top,0px)) 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:600}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.88rem}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sync{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--good)}
.card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.card.sun{background:var(--sun-soft);border-color:transparent}
.row{display:flex;align-items:center;gap:10px}
.row.wrapr{flex-wrap:wrap}
.grow{flex:1;min-width:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:999px;font-weight:700;min-height:44px}
.btn.ghost{background:var(--sunk);color:var(--fg)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:default}
input[type=text]{font:inherit;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);color:var(--fg);min-height:48px;box-sizing:border-box}
.capture{display:flex;gap:8px}
.capture input{flex:1;min-width:0}
/* tasks */
.task{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--sunk)}
.task.done{background:var(--good-soft)}
.task.done .ttl{text-decoration:line-through;color:var(--muted)}
.chk{width:30px;height:30px;flex:none;border-radius:50%;border:2.5px solid var(--accent);display:grid;place-items:center;margin-top:1px}
.chk.on{background:var(--good);border-color:var(--good)}
.chk.on::after{content:"";width:10px;height:6px;border-left:3px solid #fff;border-bottom:3px solid #fff;transform:translateY(-2px) rotate(-45deg)}
.chk.sq{border-radius:8px;width:26px;height:26px}
.ttl{font-weight:700;overflow-wrap:anywhere}
.steps{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.step{display:flex;gap:10px;align-items:center;font-size:.95rem}
.step .chk{width:22px;height:22px;border-width:2px}
.step .chk.on::after{width:7px;height:4px;border-width:2px}
.step.on span{text-decoration:line-through;color:var(--muted)}
.slot{border:2px dashed var(--line);border-radius:12px;padding:12px;color:var(--muted);text-align:left;width:100%}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.link{color:var(--accent);font-weight:700;font-size:.9rem;padding:4px 2px;min-height:32px}
.x{color:var(--muted);font-size:1.3rem;line-height:1;padding:4px 8px;min-height:36px}
/* chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:8px 12px;border-radius:999px;background:var(--sunk);font-weight:700;font-size:.92rem;min-height:40px;font-variant-numeric:tabular-nums}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.hl{display:grid;grid-template-columns:110px 1fr;gap:10px 12px;align-items:center}
@media (max-width:400px){.hl{grid-template-columns:1fr}}
.water{display:flex;gap:4px;flex-wrap:wrap}
.drop{width:28px;height:36px;border-radius:6px 6px 12px 12px;background:var(--sunk);border:2px solid var(--line)}
.drop.on{background:var(--accent);border-color:var(--accent)}
/* progress */
.bar{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>b{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s}
/* week */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;min-width:0}
.col{width:100%;max-width:34px;height:90px;background:var(--sunk);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}
.col>b{width:100%;background:var(--accent);border-radius:8px}
.col.sunc>b{background:var(--sun)}
.day.today{color:var(--fg);font-weight:700}
.dots{display:flex;gap:3px;height:8px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--sunk)}
.dots i.on{background:var(--good)}
.insight{background:var(--sun-soft);border-radius:12px;padding:12px 14px}
/* tabbar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:560px}
nav.tabs button{padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.8rem;font-weight:700;color:var(--muted);min-height:56px}
nav.tabs button.on{color:var(--accent)}
nav.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge{background:var(--sun);color:#2a2000;border-radius:99px;padding:0 6px;font-size:.7rem;margin-left:2px}
/* overlay timer */
.overlay{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));text-align:center}
.clock{font-family:var(--display);font-size:clamp(4rem,22vw,7rem);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.ring{width:min(70vw,260px);aspect-ratio:1;max-width:100%}
.ring circle{fill:none;stroke-width:10}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:700;z-index:30;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 24px #0003}
.edit input{min-height:40px;padding:8px 10px}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--sun-soft);color:var(--fg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{0%{transform:translateX(-50%) scale(.9);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
.toast{animation:pop .25s ease-out}
</style>

</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs" aria-label="Bereiche"><div class="in" id="tabs"></div></nav>
<div class="overlay" id="focus" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const LS='nessaflow-v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const dkey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
const PRAISE=['Stark gemacht!','Erledigt. Gönn dir kurz was Schönes.','Ein Schritt mehr als vorhin.','Das zählt!','Weiter so, ganz in deinem Tempo.','Geschafft. Atme kurz durch.'];

function defaults(){
  return {
    v:1, tasks:[
      {id:uid(),title:'Wäsche waschen (Beispiel)',steps:[{id:uid(),t:'Wäschekorb ins Bad tragen',done:false},{id:uid(),t:'Maschine anstellen',done:false},{id:uid(),t:'Wäsche aufhängen',done:false}],today:dkey(),done:false},
      {id:uid(),title:'Arzttermin vereinbaren (Beispiel)',steps:[],today:null,done:false},
      {id:uid(),title:'E-Mails von gestern beantworten (Beispiel)',steps:[],today:null,done:false}
    ],
    routines:[
      {id:'morgen',name:'Morgenroutine',time:'07:30',steps:[{id:uid(),t:'Ein Glas Wasser trinken'},{id:uid(),t:'Medikamente nehmen'},{id:uid(),t:'Zähne putzen'},{id:uid(),t:'3 Aufgaben für heute wählen'}]},
      {id:'abend',name:'Abendroutine',time:'21:30',steps:[{id:uid(),t:'Tasche für morgen packen'},{id:uid(),t:'Handy ans Ladekabel, weg vom Bett'},{id:uid(),t:'Kurz notieren, was gut lief'}]}
    ],
    rlog:{}, health:{}, doneLog:{}
  };
}

let S; try{S=JSON.parse(localStorage.getItem(LS)||'null')}catch(e){S=null}
if(!S||!S.v) S=defaults();
let tab='heute', editing=null, ui={}, dbDoc=null, syncState='local';
try{tab=localStorage.getItem(LS+'-tab')||'heute'}catch(e){}

/* ---------- persistence ---------- */
let saveT=null, writing=false, pending=false;
function save(){
  try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  if(!dbDoc) return;
  clearTimeout(saveT); saveT=setTimeout(flush,700);
}
async function flush(){
  if(writing){pending=true;return}
  writing=true;
  try{await dbDoc.set({state:JSON.stringify(S),updated:Date.now()}); setSync('ok')}catch(e){setSync('err')}
  writing=false; if(pending){pending=false;flush()}
}
function setSync(s){syncState=s;const el=$('#sync');if(el)el.outerHTML=syncHtml()}
function syncHtml(){
  const t={ok:'Gespeichert in deinem Konto',local:'Gespeichert auf diesem Gerät',err:'Speichern im Konto klappt gerade nicht, Daten bleiben auf diesem Gerät'}[syncState];
  return `<span class="sync ${syncState==='ok'?'ok':''}" id="sync"><i></i>${t}</span>`;
}
async function connect(){
  if(!window.claude||!window.claude.use) return;
  try{
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    const ref=db.doc('data/users/'+id+'/app');
    let timedOut=false; const t=setTimeout(()=>{timedOut=true},10000);
    const snap=await ref.get(); clearTimeout(t); if(timedOut) return;
    dbDoc=ref;
    if(snap.exists){
      const d=snap.data(); try{const st=JSON.parse(d.state); if(st&&st.v){S=st; try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}}catch(e){}
      syncState='ok'; render();
    } else { await flush(); }
  }catch(e){ setSync('err') }
}

/* ---------- day logic ---------- */
function rollover(){
  const today=dkey(); let changed=false;
  S.tasks.forEach(t=>{ if(t.today&&t.today!==today&&!t.done){t.today=null;changed=true} });
  const before=S.tasks.length;
  S.tasks=S.tasks.filter(t=>!(t.done&&t.doneAt&&t.doneAt<today&&daysAgo(t.doneAt)>14));
  if(S.tasks.length!==before) changed=true;
  if(changed) save();
}
function daysAgo(k){return Math.round((new Date(dkey())-new Date(k))/864e5)}
const todayTasks=()=>S.tasks.filter(t=>t.today===dkey());
const inboxTasks=()=>S.tasks.filter(t=>!t.today&&!t.done);
const H=()=>S.health[dkey()]||(S.health[dkey()]={});
const rDone=(rid,k=dkey())=>((S.rlog[k]||{})[rid])||[];
function currentRoutine(){const h=new Date().getHours();return S.routines.find(r=>r.id===(h<14?'morgen':'abend'))||S.routines[0]}

/* ---------- views ---------- */
function vHeute(){
  const d=new Date(), tt=todayTasks(), h=H(), r=currentRoutine();
  const hr=d.getHours(), greet=hr<11?'Guten Morgen':hr<17?'Hallo':'Guten Abend';
  const doneN=tt.filter(t=>t.done).length;
  let slots='';
  tt.forEach(t=>slots+=taskHtml(t,true));
  for(let i=tt.length;i<3;i++) slots+=`<button class="slot" data-act="pick">+ Aufgabe für heute wählen</button>`;
  const rd=rDone(r.id), pct=r.steps.length?Math.round(rd.length/r.steps.length*100):0;
  return `
  <header class="top"><div><div class="eyebrow">${WD[d.getDay()]}, ${d.getDate()}.${d.getMonth()+1}.</div><h1>${greet}, Vanessa</h1></div>${syncHtml()}</header>
  <section class="card">
    <div class="row"><h2 class="grow">Deine 3 für heute</h2><span class="muted small">${doneN} von ${Math.max(tt.length,0)} erledigt</span></div>
    ${slots}
    ${ui.picking?pickerHtml():''}
    <p class="muted small" style="margin:0">Mehr als drei braucht es nicht. Alles andere wartet entspannt in der Inbox.</p>
  </section>
  <section class="card sun">
    <div class="row"><div class="grow"><div class="eyebrow">Jetzt dran · ${esc(r.time)} Uhr</div><h2>${esc(r.name)}</h2></div><strong>${rd.length}/${r.steps.length}</strong></div>
    <div class="bar"><b style="width:${pct}%"></b></div>
    <div class="steps">${r.steps.map(s=>`<button class="step ${rd.includes(s.id)?'on':''}" data-act="rstep" data-r="${r.id}" data-s="${s.id}"><span class="chk sq ${rd.includes(s.id)?'on':''}"></span><span>${esc(s.t)}</span></button>`).join('')}</div>
  </section>
  <section class="card">
    <div class="row"><h2 class="grow">Kurzer Check-in</h2><span class="muted small">10 Sekunden</span></div>
    ${healthForm(h)}
  </section>`;
}
function pickerHtml(){
  const list=inboxTasks();
  return `<div class="card" style="background:var(--sunk);border:0">
    <div class="eyebrow">Aus der Inbox holen</div>
    ${list.length?list.map(t=>`<button class="row" style="text-align:left;padding:6px 0" data-act="totoday" data-id="${t.id}"><span class="chk" style="width:24px;height:24px"></span><span class="grow">${esc(t.title)}</span></button>`).join(''):'<p class="muted small" style="margin:0">Die Inbox ist leer.</p>'}
    <div class="capture"><input type="text" id="quickToday" placeholder="Oder neu eintippen…" aria-label="Neue Aufgabe für heute"><button class="btn sm" data-act="addtoday">Dazu</button></div>
    <button class="link" data-act="pickclose" style="align-self:flex-start">Schließen</button>
  </div>`;
}
function taskHtml(t,isToday){
  const stepsDone=t.steps.filter(s=>s.done).length;
  const open=ui.open===t.id;
  return `<div class="task ${t.done?'done':''}">
    <button class="chk ${t.done?'on':''}" data-act="done" data-id="${t.id}" aria-label="${t.done?'Als offen markieren':'Erledigt'}"></button>
    <div class="grow">
      <div class="row"><span class="ttl grow">${esc(t.title)}</span>${t.steps.length?`<span class="muted small">${stepsDone}/${t.steps.length}</span>`:''}</div>
      ${t.steps.length&&!t.done?`<div class="steps">${t.steps.map(s=>`<div class="step ${s.done?'on':''}"><button class="chk ${s.done?'on':''}" data-act="step" data-id="${t.id}" data-s="${s.id}" aria-label="Schritt erledigt"></button><span class="grow">${esc(s.t)}</span>${open?`<button class="x" data-act="delstep" data-id="${t.id}" data-s="${s.id}" aria-label="Schritt löschen">×</button>`:''}</div>`).join('')}</div>`:''}
      ${t.done?'':`<div class="tools">
        ${isToday?`<button class="btn sm" data-act="focus" data-id="${t.id}">Fokus starten</button>`:`<button class="btn sm" data-act="totoday" data-id="${t.id}">Für heute</button>`}
        <button class="btn sm ghost" data-act="open" data-id="${t.id}">${open?'Fertig':'Schritte'}</button>
        ${isToday?`<button class="link" data-act="later" data-id="${t.id}">Später</button>`:`<button class="link" data-act="del" data-id="${t.id}">Löschen</button>`}
      </div>`}
      ${open&&!t.done?`<div class="capture edit" style="margin-top:8px"><input type="text" id="stepIn" placeholder="Kleiner Schritt, 5 bis 15 Minuten" aria-label="Neuer Schritt"><button class="btn sm" data-act="addstep" data-id="${t.id}">+</button></div>
        ${ui.sample?`<button class="link" data-act="suggest" data-id="${t.id}" ${ui.suggesting?'disabled':''}>${ui.suggesting?'Claude denkt nach…':'Schritte von Claude vorschlagen lassen'}</button>`:''}`:''}
    </div></div>`;
}
function healthForm(h){
  const sl=[['<5',4.5],['5',5],['6',6],['7',7],['8',8],['9+',9.5]];
  const moods=[[1,'mies'],[2,'naja'],[3,'okay'],[4,'gut'],[5,'super']];
  let drops='';for(let i=1;i<=8;i++)drops+=`<button class="drop ${(h.water||0)>=i?'on':''}" data-act="water" data-v="${i}" aria-label="${i} Gläser"></button>`;
  return `<div class="hl">
    <span class="eyebrow">Schlaf (Std.)</span><div class="chips">${sl.map(([l,v])=>`<button class="chip ${h.sleep===v?'on':''}" data-act="h" data-k="sleep" data-v="${v}">${l}</button>`).join('')}</div>
    <span class="eyebrow">Wasser</span><div class="row wrapr"><div class="water">${drops}</div><span class="muted small">${h.water||0} von 8 Gläsern</span></div>
    <span class="eyebrow">Medikamente</span><div class="chips"><button class="chip ${h.meds===true?'on':''}" data-act="h" data-k="meds" data-v="true">genommen</button><button class="chip ${h.meds===false?'on':''}" data-act="h" data-k="meds" data-v="false">heute nicht</button></div>
    <span class="eyebrow">Bewegung</span><div class="chips"><button class="chip ${h.move===true?'on':''}" data-act="h" data-k="move" data-v="true">ja, ein bisschen</button><button class="chip ${h.move===false?'on':''}" data-act="h" data-k="move" data-v="false">noch nicht</button></div>
    <span class="eyebrow">Stimmung</span><div class="chips">${moods.map(([v,l])=>`<button class="chip ${h.mood===v?'on':''}" data-act="h" data-k="mood" data-v="${v}">${l}</button>`).join('')}</div>
  </div>`;
}
function vInbox(){
  const list=inboxTasks();
  return `<header class="top"><div><div class="eyebrow">Alles raus aus dem Kopf</div><h1>Inbox</h1></div></header>
  <section class="card">
    <div class="capture"><input type="text" id="capIn" placeholder="Was geht dir durch den Kopf?" aria-label="Neuer Gedanke oder Aufgabe"><button class="btn" data-act="capture">Merken</button></div>
    <p class="muted small" style="margin:0">Einfach notieren, sortieren kannst du später. Nichts hier hat ein Fälligkeitsdatum.</p>
  </section>
  <section class="card">
    <div class="row"><h2 class="grow">Wartet auf dich</h2><span class="muted small">${list.length}</span></div>
    ${list.length?list.map(t=>taskHtml(t,false)).join(''):'<p class="muted" style="margin:0">Leer und ruhig. Schön.</p>'}
  </section>`;
}
function vRoutinen(){
  return `<header class="top"><div><div class="eyebrow">Gleiche Schritte, jeden Tag</div><h1>Routinen</h1></div></header>
  ${S.routines.map(r=>{
    const rd=rDone(r.id), ed=ui.redit===r.id;
    let week=0;for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);if(rDone(r.id,dkey(d)).length)week++}
    return `<section class="card">
      <div class="row"><div class="grow"><div class="eyebrow">${esc(r.time)} Uhr</div><h2>${esc(r.name)}</h2></div><button class="btn sm ghost" data-act="redit" data-r="${r.id}">${ed?'Fertig':'Bearbeiten'}</button></div>
      <div class="bar"><b style="width:${r.steps.length?rd.length/r.steps.length*100:0}%"></b></div>
      <div class="steps">${r.steps.map(s=>`<div class="step ${rd.includes(s.id)?'on':''}"><button class="chk sq ${rd.includes(s.id)?'on':''}" data-act="rstep" data-r="${r.id}" data-s="${s.id}" aria-label="Schritt erledigt"></button><span class="grow">${esc(s.t)}</span>${ed?`<button class="x" data-act="rdel" data-r="${r.id}" data-s="${s.id}" aria-label="Schritt löschen">×</button>`:''}</div>`).join('')}</div>
      ${ed?`<div class="capture edit"><input type="text" id="rIn-${r.id}" placeholder="Neuer Schritt" aria-label="Neuer Routine-Schritt"><button class="btn sm" data-act="radd" data-r="${r.id}">+</button></div>
        <div class="row"><span class="eyebrow">Uhrzeit</span><input type="time" id="rT-${r.id}" value="${esc(r.time)}" data-act-change="rtime" data-r="${r.id}" style="font:inherit;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);color:var(--fg)"></div>`:''}
      <p class="muted small" style="margin:0">An ${week} der letzten 7 Tage angefangen. Ausgelassene Tage sind okay, morgen geht es einfach weiter.</p>
    </section>`}).join('')}`;
}
function vWoche(){
  const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(d)}
  const col=(v,max,cls='')=>`<div class="col ${cls}"><b style="height:${v?Math.min(100,v/max*100):0}%"></b></div>`;
  const row=(label,fn)=>`<div class="eyebrow">${label}</div><div class="week">${days.map(fn).join('')}</div>`;
  const lab=d=>`<span>${WD[d.getDay()]}</span>`;
  const today=dkey();
  const g=d=>S.health[dkey(d)]||{};
  // insight over all logged days
  const ks=Object.keys(S.health);let a=[],b=[];
  ks.forEach(k=>{const s=S.health[k].sleep;if(s==null)return;(s>=7?a:b).push(S.doneLog[k]||0)});
  const avg=x=>x.reduce((p,c)=>p+c,0)/x.length;
  let insight='Trag ein paar Tage lang Schlaf ein, dann zeige ich dir hier, wie Schlaf und erledigte Aufgaben zusammenhängen.';
  if(a.length>=2&&b.length>=2) insight=`Nach 7+ Stunden Schlaf hast du im Schnitt ${avg(a).toFixed(1).replace('.',',')} Aufgaben geschafft, nach weniger Schlaf ${avg(b).toFixed(1).replace('.',',')}.`;
  const meds=days.filter(d=>g(d).meds===true).length;
  return `<header class="top"><div><div class="eyebrow">Die letzten 7 Tage</div><h1>Deine Woche</h1></div></header>
  <section class="card">
    ${row('Schlaf (Std.)',d=>`<div class="day ${dkey(d)===today?'today':''}">${col(g(d).sleep,10)}<span>${g(d).sleep!=null?esc(({4.5:'<5',9.5:'9+'})[g(d).sleep]||g(d).sleep):'·'}</span>${lab(d)}</div>`)}
  </section>
  <section class="card">
    ${row('Erledigte Aufgaben',d=>`<div class="day ${dkey(d)===today?'today':''}">${col(S.doneLog[dkey(d)]||0,5,'sunc')}<span>${S.doneLog[dkey(d)]||0}</span>${lab(d)}</div>`)}
  </section>
  <section class="card">
    ${row('Wasser · Bewegung · Medikamente',d=>{const h=g(d);return `<div class="day ${dkey(d)===today?'today':''}"><span style="font-variant-numeric:tabular-nums">${h.water||0}</span><div class="dots"><i class="${h.move?'on':''}" title="Bewegung"></i><i class="${h.meds?'on':''}" title="Medikamente"></i></div>${lab(d)}</div>`})}
    <p class="muted small" style="margin:0">Zahl = Gläser Wasser. Erster Punkt = Bewegung, zweiter Punkt = Medikamente. Medikamente an ${meds} von 7 Tagen eingetragen.</p>
  </section>
  <section class="card">
    ${row('Stimmung',d=>{const m=g(d).mood;return `<div class="day ${dkey(d)===today?'today':''}">${col(m,5)}<span>${m?['','mies','naja','okay','gut','super'][m]:'·'}</span>${lab(d)}</div>`})}
  </section>
  <div class="insight"><div class="eyebrow">Was mir auffällt</div><p style="margin:4px 0 0">${insight}</p></div>
  <section class="card"><h2>Daten sichern</h2><p class="muted small" style="margin:0">Deine Daten liegen nur auf diesem iPhone. Sichere sie ab und zu als Datei, zum Beispiel in iCloud Drive.</p>
  <div class="row wrapr"><button class="btn sm" data-act="export">Sicherung speichern</button><label class="btn sm ghost" for="importIn" style="display:inline-flex;align-items:center">Sicherung laden</label><input type="file" id="importIn" accept="application/json,.json" hidden></div></section>`;
}
const ICONS={
  heute:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  inbox:'<svg viewBox="0 0 24 24"><path d="M3 13h5l1.5 3h5L16 13h5"/><path d="M5 5h14l2 8v6H3v-6z"/></svg>',
  routinen:'<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5.3L20 9"/><path d="M20 4v5h-5"/><path d="M20 12a8 8 0 0 1-14 5.3L4 15"/><path d="M4 20v-5h5"/></svg>',
  woche:'<svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>'};
function render(){
  rollover();
  const v={heute:vHeute,inbox:vInbox,routinen:vRoutinen,woche:vWoche}[tab]||vHeute;
  const active=document.activeElement&&document.activeElement.id;
  $('#app').innerHTML=v();
  const n=inboxTasks().length;
  $('#tabs').innerHTML=[['heute','Heute'],['inbox','Inbox'],['routinen','Routinen'],['woche','Woche']].map(([k,l])=>`<button class="${tab===k?'on':''}" data-tab="${k}" aria-current="${tab===k?'page':'false'}">${ICONS[k]}<span>${l}${k==='inbox'&&n?`<span class="badge">${n}</span>`:''}</span></button>`).join('');
  if(active){const el=document.getElementById(active);if(el&&el.tagName==='INPUT')el.focus()}
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;t.style.animation='none';t.offsetHeight;t.style.animation='';clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}
const find=id=>S.tasks.find(t=>t.id===id);

/* ---------- focus timer ---------- */
let F=null;
function startFocus(id){
  const t=find(id); F={id,len:10*60,left:10*60,run:false,end:0}; drawFocus();
}
function drawFocus(){
  const o=$('#focus'); if(!F){o.hidden=true;return}
  const t=find(F.id); if(!t){F=null;o.hidden=true;return}
  const step=t.steps.find(s=>!s.done);
  const m=Math.floor(F.left/60), s=F.left%60, C=2*Math.PI*110, p=F.left/F.len;
  o.hidden=false;
  o.innerHTML=`<div class="eyebrow">Fokus auf</div><h2 style="font-size:1.4rem">${esc(step?step.t:t.title)}</h2>
  ${step?`<div class="muted small">aus: ${esc(t.title)}</div>`:''}
  <svg class="ring" viewBox="0 0 240 240"><circle cx="120" cy="120" r="110" stroke="var(--sunk)"/><circle cx="120" cy="120" r="110" stroke="var(--accent)" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" transform="rotate(-90 120 120)" stroke-linecap="round"/><text x="120" y="138" text-anchor="middle" fill="var(--fg)" style="font-family:var(--display);font-weight:800;font-size:52px;font-variant-numeric:tabular-nums">${m}:${String(s).padStart(2,'0')}</text></svg>
  ${F.run?'':`<div class="chips" style="justify-content:center">${[5,10,15,25].map(x=>`<button class="chip ${F.len===x*60?'on':''}" data-act="flen" data-v="${x}">${x} Min.</button>`).join('')}</div>`}
  <div class="row wrapr" style="justify-content:center">
    <button class="btn" data-act="ftoggle">${F.run?'Pause':(F.left<F.len?'Weiter':'Los geht’s')}</button>
    ${step?`<button class="btn ghost" data-act="fstep">Schritt erledigt</button>`:`<button class="btn ghost" data-act="fdone">Aufgabe erledigt</button>`}
  </div>
  <button class="link" data-act="fclose">Zurück</button>`;
}
let tick=null, wake=null;
function runTimer(on){
  F.run=on; clearInterval(tick);
  if(on){F.end=Date.now()+F.left*1000; tick=setInterval(()=>{F.left=Math.max(0,Math.round((F.end-Date.now())/1000)); if(F.left===0){clearInterval(tick);F.run=false;beep();toast('Zeit um! Wie lief es?')} drawFocus()},500);
    try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{})}catch(e){}
  } else { try{wake&&wake.release()}catch(e){} }
  drawFocus();
}
let actx=null;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=660+d*400;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.0001,actx.currentTime+d);g.gain.exponentialRampToValueAtTime(.2,actx.currentTime+d+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d+.22);o.start(actx.currentTime+d);o.stop(actx.currentTime+d+.25)})}catch(e){}}

/* ---------- actions ---------- */
function setDone(t,on){
  const k=dkey(); t.done=on;
  if(on){t.doneAt=k; S.doneLog[k]=(S.doneLog[k]||0)+1; if(!t.today) t.today=k; toast(PRAISE[Math.floor(Math.random()*PRAISE.length)])}
  else{ if(t.doneAt&&S.doneLog[t.doneAt]) S.doneLog[t.doneAt]--; t.doneAt=null }
}
function addTask(title,today){title=title.trim();if(!title)return false;S.tasks.push({id:uid(),title,steps:[],today:today?dkey():null,done:false});return true}
document.addEventListener('click',async e=>{
  const tb=e.target.closest('[data-tab]'); if(tb){tab=tb.dataset.tab;ui={sample:ui.sample};try{localStorage.setItem(LS+'-tab',tab)}catch(e){};render();window.scrollTo(0,0);return}
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const a=b.dataset.act, t=b.dataset.id&&find(b.dataset.id);
  switch(a){
    case 'pick': ui.picking=true; break;
    case 'pickclose': ui.picking=false; break;
    case 'totoday':
      if(todayTasks().filter(x=>!x.done).length>=3){toast('Heute sind schon 3 offen. Erst eins schaffen oder auf später schieben.');return}
      t.today=dkey(); ui.picking=false; if(tab==='inbox')toast('Ist jetzt bei „Heute“.'); break;
    case 'addtoday': { const i=$('#quickToday'); if(todayTasks().filter(x=>!x.done).length>=3){toast('Heute sind schon 3 offen.');return} if(addTask(i.value,true)) ui.picking=false; break }
    case 'later': t.today=null; toast('Zurück in die Inbox. Ganz ohne Druck.'); break;
    case 'done': setDone(t,!t.done); if(t.done&&F&&F.id===t.id){runTimer(false);F=null;drawFocus()} break;
    case 'step': { const s=t.steps.find(x=>x.id===b.dataset.s); s.done=!s.done; if(s.done&&t.steps.every(x=>x.done)){setDone(t,true)} break }
    case 'open': ui.open=ui.open===t.id?null:t.id; break;
    case 'addstep': { const i=$('#stepIn'); const v=i.value.trim(); if(v){t.steps.push({id:uid(),t:v,done:false}); save(); render(); $('#stepIn')&&$('#stepIn').focus(); return} break }
    case 'delstep': t.steps=t.steps.filter(x=>x.id!==b.dataset.s); break;
    case 'suggest': return suggest(t);
    case 'del': S.tasks=S.tasks.filter(x=>x.id!==t.id); toast('Gelöscht.'); break;
    case 'capture': { const i=$('#capIn'); if(addTask(i.value,false)){toast('Gemerkt.')} save(); render(); $('#capIn').focus(); return }
    case 'rstep': { const k=dkey(); S.rlog[k]=S.rlog[k]||{}; const arr=S.rlog[k][b.dataset.r]=S.rlog[k][b.dataset.r]||[]; const i=arr.indexOf(b.dataset.s); if(i>=0)arr.splice(i,1); else {arr.push(b.dataset.s); const r=S.routines.find(x=>x.id===b.dataset.r); if(arr.length===r.steps.length) toast(r.name+' geschafft!')} break }
    case 'redit': ui.redit=ui.redit===b.dataset.r?null:b.dataset.r; break;
    case 'radd': { const r=S.routines.find(x=>x.id===b.dataset.r), i=$('#rIn-'+r.id); if(i.value.trim()) r.steps.push({id:uid(),t:i.value.trim()}); save(); render(); $('#rIn-'+r.id).focus(); return }
    case 'rdel': { const r=S.routines.find(x=>x.id===b.dataset.r); r.steps=r.steps.filter(x=>x.id!==b.dataset.s); break }
    case 'h': { const h=H(), k=b.dataset.k; let v=b.dataset.v; v=v==='true'?true:v==='false'?false:Number(v); h[k]=h[k]===v?undefined:v; break }
    case 'water': { const h=H(), v=Number(b.dataset.v); h.water=h.water===v?v-1:v; break }
    case 'export': { const blob=new Blob([JSON.stringify(S)],{type:'application/json'}); const f=new File([blob],'nessaflow-'+dkey()+'.json',{type:'application/json'});
      try{ if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'NessaFlow-Sicherung'});return} }catch(err){ if(err&&err.name==='AbortError')return }
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=f.name; a.click(); return }
    case 'focus': startFocus(t.id); return;
    case 'flen': F.len=F.left=Number(b.dataset.v)*60; drawFocus(); return;
    case 'ftoggle': runTimer(!F.run); return;
    case 'fstep': { const ft=find(F.id), s=ft.steps.find(x=>!x.done); if(s){s.done=true; toast(PRAISE[Math.floor(Math.random()*PRAISE.length)]); if(ft.steps.every(x=>x.done)){setDone(ft,true);runTimer(false);F=null}} save(); render(); drawFocus(); return }
    case 'fdone': { const ft=find(F.id); setDone(ft,true); runTimer(false); F=null; save(); render(); drawFocus(); return }
    case 'fclose': runTimer(false); F=null; drawFocus(); render(); return;
    default: return;
  }
  save(); render();
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.target.tagName!=='INPUT')return;
  const map={capIn:'capture',quickToday:'addtoday',stepIn:'addstep'};
  let act=map[e.target.id]; if(!act&&e.target.id.startsWith('rIn-'))act='radd';
  if(act){e.preventDefault();const btn=e.target.parentElement.querySelector(`[data-act="${act}"]`);btn&&btn.click()}
});
document.addEventListener('change',e=>{
  if(e.target.id==='importIn'&&e.target.files[0]){const r=new FileReader();r.onload=()=>{try{const st=JSON.parse(r.result);if(st&&st.v&&Array.isArray(st.tasks)){S=st;save();render();toast('Sicherung geladen.')}else toast('Diese Datei ist keine NessaFlow-Sicherung.')}catch(err){toast('Diese Datei ist keine NessaFlow-Sicherung.')}};r.readAsText(e.target.files[0]);return}
  if(e.target.dataset.actChange==='rtime'){const r=S.routines.find(x=>x.id===e.target.dataset.r); if(e.target.value){r.time=e.target.value; save()}}
});

/* ---------- Claude suggests steps ---------- */
let sampler=null;
async function suggest(t){
  if(!sampler) return;
  ui.suggesting=true; render();
  try{
    const res=await sampler.json(`Zerlege diese Aufgabe für eine Person mit ADHS in 3 bis 5 sehr konkrete, kleine Schritte von je 5 bis 15 Minuten. Der erste Schritt soll extrem leicht anzufangen sein. Deutsch, Du-Form, je höchstens 8 Wörter. Antworte nur als JSON-Array von Strings.\n\nAufgabe: ${t.title}`,{modelTier:'quick'});
    const arr=Array.isArray(res)?res:(res&&res.steps)||[];
    arr.slice(0,6).forEach(x=>{if(typeof x==='string'&&x.trim())t.steps.push({id:uid(),t:x.trim(),done:false})});
    if(!arr.length) toast('Hat nicht geklappt. Schreib einfach selbst einen ersten Mini-Schritt.');
  }catch(err){ if(err&&err.code==='not_granted'){ui.sample=false} toast('Vorschlag gerade nicht möglich.') }
  ui.suggesting=false; save(); render();
}

render();
if(window.claude&&window.claude.use){
  connect();
  claude.use('sample').then(s=>{if(s){sampler=s;ui.sample=true;render()}}).catch(()=>{});
}
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!F)render()});
})();
</script>
