<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NessaFlow">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef0f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141725" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>NessaFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: one calm column (max 560px), five-tab bar at the bottom, one topic per card, big tap targets */
:root{
  --bg:#eef0f6; --surface:#ffffff; --sunk:#e3e6f0; --fg:#1d2233; --muted:#5d6480;
  --line:#d3d7e6; --accent:#3b4fd8; --accent-ink:#ffffff; --sun:#f2b630; --sun-soft:#fdf1d2;
  --good:#2f8a5b; --good-soft:#dff2e7; --warn:#c2571d; --warn-soft:#fde5d6;
  --c-org:#3b4fd8; --c-health:#2f8a5b; --c-study:#8a4fd8; --c-money:#c28a10; --c-family:#d8507a;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141725; --surface:#1e2234; --sunk:#262b40; --fg:#eceef7; --muted:#a2a8c4;
  --line:#333952; --accent:#8c9bff; --accent-ink:#11142a; --sun:#f5c452; --sun-soft:#3a3220;
  --good:#6fd39c; --good-soft:#1d3a2b; --warn:#ff9a6b; --warn-soft:#43281c;
  --c-org:#8c9bff; --c-health:#6fd39c; --c-study:#c39bff; --c-money:#f5c452; --c-family:#ff8fb1; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141725; --surface:#1e2234; --sunk:#262b40; --fg:#eceef7; --muted:#a2a8c4;
  --line:#333952; --accent:#8c9bff; --accent-ink:#11142a; --sun:#f5c452; --sun-soft:#3a3220;
  --good:#6fd39c; --good-soft:#1d3a2b; --warn:#ff9a6b; --warn-soft:#43281c;
  --c-org:#8c9bff; --c-health:#6fd39c; --c-study:#c39bff; --c-money:#f5c452; --c-family:#ff8fb1; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
.wrap{max-width:560px;margin:0 auto;padding-block:calc(20px + env(safe-area-inset-top,0px)) 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
p{margin:0}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.num{font-variant-numeric:tabular-nums}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
header.top .eyebrow{color:var(--area)}
.card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.card.sun{background:var(--sun-soft);border-color:transparent}
.row{display:flex;align-items:center;gap:10px}
.row.wrapr{flex-wrap:wrap}
.row.top{align-items:flex-start}
.grow{flex:1;min-width:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:left}
button:focus-visible,input:focus-visible,label:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:999px;font-weight:700;min-height:44px;text-align:center;white-space:nowrap}
.btn.ghost{background:var(--sunk);color:var(--fg)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:default}
.in{font:inherit;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);color:var(--fg);min-height:46px;min-width:0;-webkit-appearance:none;appearance:none}
input[type=date].in,input[type=time].in{min-height:46px}
.form{display:flex;flex-direction:column;gap:8px}
.fr{display:flex;gap:8px;align-items:center}
.fr>.in{flex:1}
.fr>.in.narrow{flex:0 0 120px}
.sec-h{display:flex;align-items:center;gap:10px}
.sec-h h2{flex:1;min-width:0}
/* tasks & checks */
.task{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--sunk)}
.task.done{background:var(--good-soft)}
.task.done .ttl{text-decoration:line-through;color:var(--muted)}
.chk{width:30px;height:30px;flex:none;border-radius:50%;border:2.5px solid var(--accent);display:grid;place-items:center}
.chk.on{background:var(--good);border-color:var(--good)}
.chk.on::after{content:"";width:10px;height:6px;border-left:3px solid #fff;border-bottom:3px solid #fff;transform:translateY(-2px) rotate(-45deg)}
.chk.sq{border-radius:8px;width:26px;height:26px}
.ttl{font-weight:700;overflow-wrap:anywhere}
.steps{display:flex;flex-direction:column;gap:6px}
.step{display:flex;gap:10px;align-items:center;font-size:.95rem;min-height:34px}
.step .chk{width:24px;height:24px;border-width:2px}
.step .chk.on::after{width:8px;height:5px;border-width:2px}
.step.on>span{text-decoration:line-through;color:var(--muted)}
.slot{border:2px dashed var(--line);border-radius:12px;padding:12px;color:var(--muted);width:100%}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.link{color:var(--accent);font-weight:700;font-size:.9rem;padding:4px 2px;min-height:32px}
.x{color:var(--muted);font-size:1.4rem;line-height:1;padding:4px 8px;min-height:36px;min-width:36px;text-align:center}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--fg);white-space:nowrap}
.pill.study{background:color-mix(in srgb,var(--c-study) 22%,transparent)}
.pill.family{background:color-mix(in srgb,var(--c-family) 22%,transparent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.good{background:var(--good-soft);color:var(--good)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.88rem;flex:none;min-width:58px}
.li.today .when{color:var(--accent);font-weight:700}
/* chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:8px 12px;border-radius:999px;background:var(--sunk);font-weight:700;font-size:.92rem;min-height:40px;font-variant-numeric:tabular-nums;text-align:center}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.hl{display:grid;grid-template-columns:110px 1fr;gap:10px 12px;align-items:center}
@media (max-width:400px){.hl{grid-template-columns:1fr}}
.water{display:flex;gap:4px;flex-wrap:wrap}
.drop{width:28px;height:36px;border-radius:6px 6px 12px 12px;background:var(--sunk);border:2px solid var(--line)}
.drop.on{background:var(--accent);border-color:var(--accent)}
/* bars */
.bar{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>b{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s}
.bar.money>b{background:var(--c-money)}
.bar.over>b{background:var(--warn)}
.big{font-family:var(--display);font-size:2rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--sunk);border-radius:12px;padding:10px;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:1.15rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.cat{display:grid;grid-template-columns:110px 1fr 70px;gap:8px;align-items:center;font-size:.9rem}
.cat .bar{height:8px}
/* week */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;min-width:0}
.col{width:100%;max-width:34px;height:80px;background:var(--sunk);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}
.col>b{width:100%;background:var(--accent);border-radius:8px}
.col.g>b{background:var(--good)}
.col.s>b{background:var(--sun)}
.day.today{color:var(--fg);font-weight:700}
.dots{display:flex;gap:3px;height:8px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--sunk)}
.dots i.on{background:var(--good)}
.rweek{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.rw{display:grid;grid-template-columns:60px 1fr auto;gap:10px;align-items:center}
.rdots{display:flex;gap:5px;flex-wrap:nowrap}
.rdots i{width:18px;height:18px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.rdots i.part{background:color-mix(in srgb,var(--good) 40%,var(--surface));border-color:var(--good)}
.rdots i.on{background:var(--good);border-color:var(--good)}
.rdots i.now{outline:2px solid var(--fg);outline-offset:1px}
.sync{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;flex:none}
.sync.ok i{background:var(--good)}
.sync.err i{background:var(--warn)}
.insight{background:var(--sun-soft);border-radius:12px;padding:12px 14px}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.spark{width:100%;height:70px;display:block}
.family-hero{display:flex;gap:14px;align-items:center}
.family-hero img{width:72px;height:72px;border-radius:18px;flex:none}
/* tabbar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs .in2{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:560px}
nav.tabs button{padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;font-weight:700;color:var(--muted);min-height:58px;text-align:center}
nav.tabs button.on{color:var(--tc)}
nav.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge{background:var(--sun);color:#2a2000;border-radius:99px;padding:0 5px;font-size:.66rem;margin-left:2px}
/* overlay timer */
.overlay{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));text-align:center}
.ring{width:min(70vw,260px);aspect-ratio:1;max-width:100%}
.ring circle{fill:none;stroke-width:10}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:700;z-index:30;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 24px #0003;animation:pop .25s ease-out}
@keyframes pop{0%{transform:translateX(-50%) scale(.9);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs" aria-label="Bereiche"><div class="in2" id="tabs"></div></nav>
<div class="overlay" id="focus" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const LS='nessaflow-v1';
const VERSION='2.4';
const SB_URL=''; // Supabase Project URL
const SB_KEY=''; // Supabase anon public key
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const dkey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>dkey();
const parseD=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const daysUntil=k=>Math.round((parseD(k)-parseD(today()))/864e5);
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
const MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const fmtD=k=>{const d=parseD(k);return WD[d.getDay()]+', '+d.getDate()+'.'+(d.getMonth()+1)+'.'};
const eur=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(n||0);
const num=v=>{const n=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:NaN};
const PRAISE=['Stark gemacht!','Erledigt. Gönn dir kurz was Schönes.','Ein Schritt mehr als vorhin.','Das zählt!','Weiter so, ganz in deinem Tempo.','Geschafft. Atme kurz durch.'];
const praise=()=>PRAISE[Math.floor(Math.random()*PRAISE.length)];
const CATS=['Lebensmittel','Wohnen','Mobilität','Freizeit','Kleidung','Ilvy','Gesundheit','Studium','Geschenke','Sonstiges'];
const SPORTS=['Gassi mit Ilvy','Spazieren','Joggen','Yoga','Fitness','Radfahren','Schwimmen'];
const QT=['Zusammen kochen','Spaziergang mit Ilvy','Filmabend','Essen gehen','Ausflug','Spieleabend','Einfach reden'];

/* ---------- state ---------- */
function blank(){return{v:2,tasks:[],routines:[],rlog:{},health:{},doneLog:{},events:[],meds:[],medLog:{},sport:[],weight:[],deadlines:[],expenses:[],budget:0,saving:{name:'',target:0,entries:[]},qt:[],ideas:[]}}
function starter(){
  const s=blank();
  s.tasks=[{id:uid(),title:'Wäsche waschen (Beispiel)',area:'org',steps:[{id:uid(),t:'Wäschekorb ins Bad tragen',done:false},{id:uid(),t:'Maschine anstellen',done:false},{id:uid(),t:'Wäsche aufhängen',done:false}],today:dkey(),done:false}];
  return s;
}
const MORNING=[['Zähneputzen und Gesichtspflege',10],['Morgen-Yoga + Ilvy-Yoga',15],['Kuscheleinheit mit Ilvy',10],['Anziehen',5],['Haare machen',5],['Schminken',10],['Schmuck anlegen',2],['Kaffee kochen und Frühstück einpacken',10],['Gassi-Runde = Weg zur Arbeit',45]];
function defRoutines(){return[
  {id:'morgen',name:'Morgenroutine',time:'07:30',steps:[{id:uid(),t:'Ein Glas Wasser trinken'},{id:uid(),t:'Medikamente nehmen'},{id:uid(),t:'Zähne putzen'},{id:uid(),t:'3 Aufgaben für heute wählen'}]},
  {id:'abend',name:'Abendroutine',time:'21:30',steps:[{id:uid(),t:'Tasche für morgen packen'},{id:uid(),t:'Handy ans Ladekabel, weg vom Bett'},{id:uid(),t:'Kurz notieren, was gut lief'}]}]}
const ilvyRoutine=()=>({id:'ilvy',name:'Ilvy heute',time:'',steps:[{id:uid(),t:'Morgens füttern'},{id:uid(),t:'Gassi am Morgen'},{id:uid(),t:'Gassi am Mittag'},{id:uid(),t:'Abends füttern'},{id:uid(),t:'Gassi am Abend'},{id:uid(),t:'Frisches Wasser'}]});
function migrate(s){
  if(!s||!s.v) s=starter();
  const b=blank();
  for(const k in b) if(s[k]===undefined) s[k]=b[k];
  if(!s.routines.length) s.routines=defRoutines();
  if(!s.routines.find(r=>r.id==='ilvy')) s.routines.push(ilvyRoutine());
  s.tasks.forEach(t=>{if(!t.area)t.area='org';if(!t.steps)t.steps=[]});
  if(!s._morning2){const m=s.routines.find(r=>r.id==='morgen');if(m){m.steps=MORNING.map(([t,min])=>({id:uid(),t,min}))}s._morning2=true}
  if(!s._morning3){const m=s.routines.find(r=>r.id==='morgen');const g=m&&m.steps.find(x=>x.t==='Gassi gehen (mind. 30 Min.)');if(g){g.t='Gassi-Runde = Weg zur Arbeit';g.min=45}s._morning3=true}
  s.v=2; return s;
}
let S; try{S=JSON.parse(localStorage.getItem(LS)||'null')}catch(e){S=null}
S=migrate(S);
let tab='org', ui={f:{}};
try{tab=localStorage.getItem(LS+'-tab2')||'org'}catch(e){}
function save(bump=true){if(bump)S._ts=Date.now();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast('Speichern hat nicht geklappt. Ist der Speicher voll?')}if(bump)schedulePush()}

/* ---------- sync (Supabase) ---------- */
let sb=null,sbUser=null,sync={state:SB_URL?'out':'off',at:0},pushT=null,pushing=false,pullDone=false;
function loadSb(){return new Promise((res,rej)=>{if(window.supabase)return res();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function setSync(st){sync.state=st;if(st==='ok')sync.at=Date.now();const el=document.getElementById('syncline');if(el)el.outerHTML=syncLine()}
function syncLine(){
  const m={off:'Nur auf diesem Gerät',out:'Nicht angemeldet, Daten nur auf diesem Gerät',syncing:'Synchronisiere…',ok:'Synchronisiert'+(sync.at?' um '+new Date(sync.at).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):''),err:'Offline. Änderungen werden gesendet, sobald du wieder online bist.',ask:'Bitte wählen, welche Daten du behalten möchtest'};
  return `<span class="sync ${sync.state==='ok'?'ok':sync.state==='err'?'err':''}" id="syncline"><i></i>${m[sync.state]||''}</span>`;
}
async function sbInit(){
  if(!SB_URL||!SB_KEY)return;
  try{await loadSb()}catch(e){setSync('err');return}
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'nessaflow-auth',detectSessionInUrl:true}});
  const {data}=await sb.auth.getSession(); sbUser=data.session?data.session.user:null;
  sb.auth.onAuthStateChange((ev,sess)=>{const was=sbUser;sbUser=sess?sess.user:null;if(sbUser&&!was){pull()}if(!sbUser){setSync('out')}render()});
  if(sbUser)pull();else setSync('out');
  render();
}
async function pull(){
  if(!sb||!sbUser)return; setSync('syncing');
  const {data,error}=await sb.from('nessaflow_state').select('state,updated_at').eq('user_id',sbUser.id).maybeSingle();
  if(error){setSync('err');return}
  pullDone=true;
  if(!data){await push();return}
  if(!S._linked){ui.conflict=data;setSync('ask');render();return}
  if(Number(data.updated_at)>(S._ts||0)){applyRemote(data)}
  else if(Number(data.updated_at)<(S._ts||0)){await push()}
  else setSync('ok');
}
function applyRemote(data){S=migrate(data.state);S._ts=Number(data.updated_at);S._linked=true;save(false);setSync('ok');if(!F)render()}
function schedulePush(){if(!sb||!sbUser||!pullDone||!S._linked&&ui.conflict)return;clearTimeout(pushT);pushT=setTimeout(push,1200)}
async function push(){
  if(!sb||!sbUser)return; if(pushing){schedulePush();return}
  pushing=true;S._linked=true;if(!S._ts)S._ts=Date.now();save(false);setSync('syncing');
  const {error}=await sb.from('nessaflow_state').upsert({user_id:sbUser.id,state:S,updated_at:S._ts});
  pushing=false; setSync(error?'err':'ok');
}
window.addEventListener('online',()=>{if(sbUser)pull()});
const fv=id=>ui.f[id]??'';
const inp=(id,ph,type='text',extra='')=>`<input class="in" type="${type}" id="${id}" placeholder="${esc(ph)}" value="${esc(fv(id))}" ${extra}>`;
const clear=(...ids)=>ids.forEach(i=>delete ui.f[i]);

/* ---------- day logic ---------- */
function rollover(){
  const t=today(); let ch=false;
  S.tasks.forEach(x=>{if(x.today&&x.today!==t&&!x.done){x.today=null;ch=true}});
  const n=S.tasks.length;

function spark(vals){

/* ---------- focus timer ---------- */
let F=null,tick=null,wake=null,actx=null;
function drawFocus(){
  const o=$('#focus'); if(!F){o.hidden=true;return}
  const t=find(F.id); if(!t){F=null;o.hidden=true;return}
  const step=t.steps.find(s=>!s.done), m=Math.floor(F.left/60), s=F.left%60, C=2*Math.PI*110, p=F.left/F.len;
  o.hidden=false;
  o.innerHTML=`<div class="eyebrow">Fokus auf</div><h2 style="font-size:1.4rem">${esc(step?step.t:t.title)}</h2>${step?`<div class="muted small">aus: ${esc(t.title)}</div>`:''}
  <svg class="ring" viewBox="0 0 240 240"><circle cx="120" cy="120" r="110" stroke="var(--sunk)"/><circle cx="120" cy="120" r="110" stroke="var(--accent)" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" transform="rotate(-90 120 120)" stroke-linecap="round"/><text x="120" y="138" text-anchor="middle" fill="var(--fg)" style="font-family:var(--display);font-weight:800;font-size:52px;font-variant-numeric:tabular-nums">${m}:${String(s).padStart(2,'0')}</text></svg>
  ${F.run?'':`<div class="chips" style="justify-content:center">${[5,10,15,25].map(x=>`<button class="chip ${F.len===x*60?'on':''}" data-act="flen" data-v="${x}">${x} Min.</button>`).join('')}</div>`}
  <div class="row wrapr" style="justify-content:center"><button class="btn" data-act="ftoggle">${F.run?'Pause':(F.left<F.len?'Weiter':'Los geht’s')}</button>${step?`<button class="btn ghost" data-act="fstep">Schritt erledigt</button>`:`<button class="btn ghost" data-act="fdone">Aufgabe erledigt</button>`}</div>
  <button class="link" data-act="fclose">Zurück</button>`;
}
function runTimer(on){
  if(!F)return; F.run=on; clearInterval(tick);
  if(on){F.end=Date.now()+F.left*1000;tick=setInterval(()=>{F.left=Math.max(0,Math.round((F.end-Date.now())/1000));if(F.left===0){clearInterval(tick);F.run=false;beep();toast('Zeit um! Wie lief es?')}drawFocus()},500);
    try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{})}catch(e){}}
  else{try{wake&&wake.release()}catch(e){}}
  drawFocus();
}
function beep(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=660+d*400;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.0001,actx.currentTime+d);g.gain.exponentialRampToValueAtTime(.2,actx.currentTime+d+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d+.22);o.start(actx.currentTime+d);o.stop(actx.currentTime+d+.25)})}catch(e){}}

/* ---------- actions ---------- */
function setDone(t,on){

  if(on){t.doneAt=k;S.doneLog[k]=(S.doneLog[k]||0)+1;toast(praise())}
  else{if(t.doneAt&&S.doneLog[t.doneAt])S.doneLog[t.doneAt]--;t.doneAt=null}
}
function newTask(title,area,extra={}){title=(title||'').trim();if(!title)return null;const t=Object.assign({id:uid(),title,area,steps:[],today:null,done:false},extra);S.tasks.push(t);return t}
const A={
  pick(){ui.picking=true},
  pickclose(){ui.picking=false},
  totoday(b,t){if(openToday()>=3){toast('Heute sind schon 3 offen. Erst eins schaffen oder auf später schieben.');return false}t.today=today();ui.picking=false;if(tab!=='org')toast('Ist jetzt bei „Deine 3 für heute“.')},
  addtoday(){if(openToday()>=3){toast('Heute sind schon 3 offen.');return false}if(newTask(fv('quick'),'org',{today:today()})){clear('quick');ui.picking=false}},
  later(b,t){t.today=null;toast('Wartet jetzt wieder entspannt.')},
  done(b,t){setDone(t,!t.done);if(t.done&&F&&F.id===t.id){runTimer(false);F=null;drawFocus()}},
  step(b,t){const s=t.steps.find(x=>x.id===b.dataset.s);s.done=!s.done;if(s.done&&t.steps.every(x=>x.done))setDone(t,true)},
  open(b,t){ui.open=ui.open===t.id?null:t.id},
  addstep(b,t){const id='step-'+t.id,v=fv(id).trim();if(v){t.steps.push({id:uid(),t:v,done:false});clear(id);ui.refocus=id}},
  delstep(b,t){t.steps=t.steps.filter(x=>x.id!==b.dataset.s)},
  del(b,t){S.tasks=S.tasks.filter(x=>x.id!==t.id);toast('Gelöscht.')},
  addtask(b){const a=b.dataset.area,id='add-'+a;if(newTask(fv(id),a)){clear(id);toast('Gemerkt.');ui.refocus=id}},
  addev(){const t=fv('ev-t').trim(),d=$('#ev-d').value,h=$('#ev-h').value;if(!t){toast('Wie heißt der Termin?');return false}if(!d){toast('Bitte ein Datum wählen.');return false}S.events.push({id:uid(),title:t,date:d,time:h});clear('ev-t','ev-h','ev-d');toast('Termin eingetragen.')},
  delev(b){S.events=S.events.filter(e=>e.id!==b.dataset.id)},
  allev(){ui.allEv=!ui.allEv},
  rstep(b){const k=today();S.rlog[k]=S.rlog[k]||{};const arr=S.rlog[k][b.dataset.r]=S.rlog[k][b.dataset.r]||[];const i=arr.indexOf(b.dataset.s);if(i>=0)arr.splice(i,1);else{arr.push(b.dataset.s);const r=routine(b.dataset.r);if(arr.length===r.steps.length)toast(r.name+' geschafft!')}},
  redit(b){ui.redit=ui.redit===b.dataset.r?null:b.dataset.r},
  radd(b){const r=routine(b.dataset.r),id='r-'+r.id,v=fv(id).trim(),m=parseInt(fv('rm-'+r.id))||0;if(v){r.steps.push({id:uid(),t:v,min:m||undefined});clear(id,'rm-'+r.id);ui.refocus=id}},
  rmove(b){const r=routine(b.dataset.r),i=r.steps.findIndex(x=>x.id===b.dataset.s),j=i+Number(b.dataset.d);if(i<0||j<0||j>=r.steps.length)return false;[r.steps[i],r.steps[j]]=[r.steps[j],r.steps[i]]},
  rdel(b){const r=routine(b.dataset.r);r.steps=r.steps.filter(x=>x.id!==b.dataset.s)},
  h(b){const h=H(),k=b.dataset.k,v=Number(b.dataset.v);h[k]=h[k]===v?undefined:v},
  water(b){const h=H(),v=Number(b.dataset.v);h.water=h.water===v?v-1:v},
  setf(b){const k=b.dataset.k;ui.f[k]=ui.f[k]===b.dataset.v?'':b.dataset.v;return 'ui'},
  medit(){ui.medit=!ui.medit},
  medadd(){const n=fv('m-n').trim();if(!n){toast('Wie heißt es?');return false}S.meds.push({id:uid(),name:n,dose:fv('m-d').trim(),time:fv('m-t')||'morgens',kind:fv('m-k')||'med'});clear('m-n','m-d');toast('Hinzugefügt.')},
  meddel(b){S.meds=S.meds.filter(m=>m.id!==b.dataset.id)},
  med(b){const k=today(),l=S.medLog[k]=S.medLog[k]||[],i=l.indexOf(b.dataset.id);if(i>=0)l.splice(i,1);else{l.push(b.dataset.id);if(l.length===S.meds.length)toast('Alles genommen für heute. Gut gemacht!')}},
  sportadd(){const type=fv('sp-o').trim()||fv('sp-t');if(!type){toast('Welche Sportart war es?');return false}S.sport.push({id:uid(),date:today(),type,min:Number(fv('sp-m'))||null});clear('sp-o','sp-t','sp-m');toast('Bewegung eingetragen. '+praise())},
  sportdel(b){S.sport=S.sport.filter(s=>s.id!==b.dataset.id)},
  wgset(){const v=num(fv('wg'));if(!(v>20&&v<400)){toast('Bitte das Zielgewicht in kg eintragen.');return false}S.weightGoal=Math.round(v*10)/10;clear('wg');ui.wgEdit=false;toast('Ziel gespeichert. Du schaffst das, Schritt für Schritt.')},
  wgedit(){ui.wgEdit=!ui.wgEdit},
  showother(){ui.other=!ui.other},
  wadd(){const kg=num(fv('w-kg'));if(!(kg>20&&kg<400)){toast('Bitte das Gewicht in kg eintragen, z. B. 64,5.');return false}S.weight=S.weight.filter(w=>w.date!==today());S.weight.push({date:today(),kg:Math.round(kg*10)/10});clear('w-kg');toast('Eingetragen.')},
  dladd(){const t=fv('d-t').trim(),d=$('#d-d').value;if(!t){toast('Wie heißt die Prüfung oder Abgabe?');return false}if(!d){toast('Bitte ein Datum wählen.');return false}const x={id:uid(),title:t,module:fv('d-m').trim(),date:d,kind:fv('d-k')||'exam',done:false};S.deadlines.push(x);clear('d-t','d-m','d-d');ui.dl=x.id;toast('Angelegt. Jetzt in kleine Aufgaben zerlegen.')},
  dlopen(b){ui.dl=ui.dl===b.dataset.id?null:b.dataset.id},
  dltask(b){const id='dt-'+b.dataset.id;if(newTask(fv(id),'study',{dl:b.dataset.id})){clear(id);ui.refocus=id}},
  dldone(b){const d=S.deadlines.find(x=>x.id===b.dataset.id);d.done=true;ui.dl=null;toast('Geschafft! Darauf kannst du stolz sein.')},
  dldel(b){S.deadlines=S.deadlines.filter(x=>x.id!==b.dataset.id);S.tasks=S.tasks.filter(t=>t.dl!==b.dataset.id)},
  budgetedit(){ui.budgetEdit=!ui.budgetEdit},
  budgetset(){const v=num(fv('b-a'));if(!(v>0)){toast('Bitte einen Betrag eintragen, z. B. 600.');return false}S.budget=Math.round(v*100)/100;clear('b-a');ui.budgetEdit=false;toast('Budget gespeichert.')},
  expadd(){const v=num(fv('e-a'));if(!(v>0)){toast('Bitte einen Betrag eintragen, z. B. 12,50.');return false}S.expenses.push({id:uid(),date:today(),amount:Math.round(v*100)/100,cat:fv('e-c')||'Lebensmittel',note:fv('e-n').trim()});clear('e-a','e-n');toast(eur(v)+' eingetragen.')},
  expdel(b){S.expenses=S.expenses.filter(e=>e.id!==b.dataset.id)},
  allexp(){ui.allExp=!ui.allExp},
  goaledit(){ui.goalEdit=!ui.goalEdit},
  goalset(){const t=num(fv('g-t'));if(!(t>0)){toast('Bitte ein Ziel in € eintragen.');return false}S.saving.name=fv('g-n').trim()||S.saving.name||'Sparziel';S.saving.target=Math.round(t*100)/100;clear('g-n','g-t');ui.goalEdit=false;toast('Sparziel gespeichert.')},
  saveadd(){const v=num(fv('s-a'));if(!(v>0)){toast('Bitte einen Betrag eintragen.');return false}S.saving.entries.push({date:today(),amount:Math.round(v*100)/100});clear('s-a');toast(eur(v)+' zurückgelegt. '+praise())},
  qtadd(){const w=fv('q-o').trim()||fv('q-w');if(!w){toast('Was habt ihr gemacht?');return false}S.qt.push({id:uid(),date:$('#q-d').value||today(),what:w,note:fv('q-n').trim()});clear('q-o','q-w','q-n','q-d');toast('Schöner Moment, festgehalten.')},
  qtdel(b){S.qt=S.qt.filter(x=>x.id!==b.dataset.id)},
  ideaadd(){const t=fv('i-t').trim();if(t){S.ideas.push({id:uid(),t});clear('i-t');ui.refocus='i-t'}},
  ideado(b){const i=S.ideas.find(x=>x.id===b.dataset.id);ui.f['q-o']=i.t;S.ideas=S.ideas.filter(x=>x!==i);toast('Trag es oben bei Quality Time ein.')},
  ideadel(b){S.ideas=S.ideas.filter(x=>x.id!==b.dataset.id)},
  async login(){const e=fv('au-e').trim(),pw=fv('au-p');if(!e||!pw){ui.authMsg='Bitte E-Mail und Passwort eingeben.';return 'ui'}
    ui.authMsg='Melde an…';render();const {error}=await sb.auth.signInWithPassword({email:e,password:pw});
    ui.authMsg=error?(/confirm/i.test(error.message)?'Bitte bestätige zuerst den Link in der E-Mail von Supabase, dann hier anmelden.':'Das hat nicht geklappt. Stimmen E-Mail und Passwort?'):'';if(!error)clear('au-p');return 'ui'},
  async signup(){const e=fv('au-e').trim(),pw=fv('au-p');if(!e||pw.length<6){ui.authMsg='Bitte E-Mail und ein Passwort mit mindestens 6 Zeichen eingeben.';return 'ui'}
    ui.authMsg='Lege Konto an…';render();const {data,error}=await sb.auth.signUp({email:e,password:pw,options:{emailRedirectTo:location.origin+location.pathname}});
    if(error){ui.authMsg='Das hat nicht geklappt: '+error.message;return 'ui'}
    ui.authMsg=data.session?'':'Fast geschafft! Öffne die E-Mail von Supabase, tippe auf den Link und melde dich dann hier an.';return 'ui'},
  async logout(){await sb.auth.signOut();S._linked=false;save(false);toast('Abgemeldet. Deine Daten bleiben auf diesem Gerät.');return 'ui'},
  async syncnow(){await pull();return false},
  async takeremote(){const d=ui.conflict;ui.conflict=null;applyRemote(d);toast('Daten aus dem Konto geladen.');return 'ui'},
  async takelocal(){ui.conflict=null;S._ts=Date.now();await push();toast('Daten hochgeladen.');return 'ui'},
  async update(){toast('Suche nach Updates…');try{const r=await navigator.serviceWorker?.getRegistration();if(r){await r.update();const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(e){}setTimeout(()=>location.reload(),600);return false},
  async export(){const blob=new Blob([JSON.stringify(S)],{type:'application/json'}),name='nessaflow-'+today()+'.json';
    try{const f=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'NessaFlow-Sicherung'});return false}}catch(err){if(err&&err.name==='AbortError')return false}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();return false},
  focus(b,t){F={id:t.id,len:600,left:600,run:false};drawFocus();return false},
  flen(b){F.len=F.left=Number(b.dataset.v)*60;drawFocus();return false},
  ftoggle(){runTimer(!F.run);return false},
  fstep(){const ft=find(F.id),s=ft.steps.find(x=>!x.done);if(s){s.done=true;toast(praise());if(ft.steps.every(x=>x.done)){setDone(ft,true);runTimer(false);F=null}}save();render();drawFocus();return false},
  fdone(){setDone(find(F.id),true);runTimer(false);F=null;save();render();drawFocus();return false},
  fclose(){runTimer(false);F=null;drawFocus();render();return false},
};
document.addEventListener('click',async e=>{
  const tb=e.target.closest('[data-tab]');
  if(tb){tab=tb.dataset.tab;ui={f:ui.f};try{localStorage.setItem(LS+'-tab2',tab)}catch(err){}render();window.scrollTo(0,0);return}
  const b=e.target.closest('[data-act]'); if(!b||b.disabled)return;
  const fn=A[b.dataset.act]; if(!fn)return;
  const t=b.dataset.id?find(b.dataset.id):null;
  const r=await fn(b,t);
  if(r===false)return;
  if(r!=='ui')save();
  render();
  if(ui.refocus){const el=document.getElementById(ui.refocus);ui.refocus=null;el&&el.focus()}
});
document.addEventListener('input',e=>{if(e.target.id&&e.target.classList.contains('in')&&e.target.type!=='file')ui.f[e.target.id]=e.target.value});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.target.tagName!=='INPUT'||!e.target.dataset.submit)return;
  e.preventDefault();const s=e.target.dataset.submit;
  const btn=e.target.parentElement.querySelector(`[data-act="${s}"]`)||document.querySelector(`[data-act="${s}"]`);btn&&btn.click();
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='importIn'&&el.files[0]){const fr=new FileReader();fr.onload=()=>{try{const st=JSON.parse(fr.result);if(st&&st.v&&Array.isArray(st.tasks)){S=migrate(st);save();render();toast('Sicherung geladen.')}else toast('Diese Datei ist keine NessaFlow-Sicherung.')}catch(err){toast('Diese Datei ist keine NessaFlow-Sicherung.')}};fr.readAsText(el.files[0]);return}
  if(el.dataset.change==='rtime'){const r=routine(el.dataset.r);if(el.value){r.time=el.value;save()}}
  if(el.dataset.change==='hnote'){H().note=el.value.trim();save();toast('Notiz gespeichert.')}
  if(el.type==='date'||el.type==='time')ui.f[el.id]=el.value;
});
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.toggle){ui[d.dataset.toggle]=d.open;const s=d.querySelector('summary .muted');if(s)s.textContent=d.open?'Zuklappen':'Aufklappen'}},true);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(!F)render();if(sbUser)pull()}});

render();
sbInit();
if('serviceWorker' in navigator&&location.protocol==='https:'){
  const had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
  let reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!reloaded&&!F){reloaded=true;location.reload()}});
}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
})();
</script>
